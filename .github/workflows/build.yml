name: build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: version from agent.py
        id: v
        run: echo "ver=$(grep -m1 '^VERSION' agent.py | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/justincoffe/clore-miner:${{ steps.v.outputs.ver }}
            ghcr.io/justincoffe/clore-miner:latest
          labels: |
            org.opencontainers.image.source=https://github.com/justincoffe/clore-miner
            org.opencontainers.image.description=peakminer + SRBMiner + control agent for clore.ai GPU rentals
